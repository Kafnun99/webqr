<script>
  const urlParams = new URLSearchParams(window.location.search);
  const qrId = urlParams.get('id');

  // 1. URL Apps Script Log Scan
  const SCRIPT_LOG_SCAN = "https://script.google.com/macros/s/AKfycbwbhh5YZZd7bl1vBRc7JP-iOPaCFzLztcJa9uG76p4FT3w0H4Xd_DB5gpYfUwyMehhXqw/exec"; 

  // 2. URL Apps Script DB QR Maps (Cek status & link tujuan)
  const SCRIPT_DB_QR = "https://script.google.com/macros/s/AKfycbymM3lEjniD30_XI8pC2uDtN1MYiCyNm39ARbp99rwkKKQ7N9G_4qGxiUZpZNygM3fJFU/exec";

  if (qrId) {
    // A. Kirim Log Scan secara asynchronous (Background)
    const formData = new URLSearchParams();
    formData.append('waktu', new Date().toLocaleString('id-ID'));
    formData.append('qr_id', qrId);
    formData.append('kota', 'Indonesia');
    formData.append('perangkat', navigator.userAgent);
    formData.append('ip', '-');

    fetch(SCRIPT_LOG_SCAN, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: formData
    }).catch(err => console.error("Gagal log scan:", err));

    // B. Cek Status Kartu ke Database QR Maps untuk Pengalihan
    fetch(`${SCRIPT_DB_QR}?card_id=${qrId}`)
      .then(res => res.json())
      .then(data => {
        // Ambil link tujuan (di gambar Anda, link YouTube disimpan di field nama_toko / gmaps_url / no_hp)
        const targetUrl = data.gmaps_url || data.nama_toko || data.link || data.no_hp;

        // Jika status kartu AKTIF (baik bernama 'active' atau 'TERDAFTAR / AKTIF') dan link tujuan ada:
        if ((data.card_status === 'active' || data.status === 'active' || data.status === 'TERDAFTAR / AKTIF') && targetUrl && targetUrl.startsWith('http')) {
          // LANGSUNG LEMPAR KE LINK TUJUAN (YouTube/Google Maps)
          window.location.href = targetUrl;
        } else {
          // JIKA BELUM AKTIF -> Lempar ke Halaman Aktivasi Form
          window.location.href = `https://qr-maps.vercel.app/activate.html?id=${qrId}`; 
        }
      })
      .catch(err => {
        console.error("Error cek DB QR:", err);
        // Fallback jika API error
        window.location.href = `https://qr-maps.vercel.app/activate.html?id=${qrId}`;
      });
</script>
