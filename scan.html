<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengarahkan...</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 3px solid #1e293b;
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div>
        <div class="loader"></div>
        <p>Mengarahkan Anda ke tujuan...</p>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const qrId = urlParams.get('id');

      // 1. URL Apps Script Log Scan (bikinkarya/webqr)
      const SCRIPT_LOG_SCAN = "https://script.google.com/macros/s/AKfycbwbhh5YZZd7bl1vBRc7JP-iOPaCFzLztcJa9uG76p4FT3w0H4Xd_DB5gpYfUwyMehhXqw/exec"; 

      // 2. URL Apps Script DB QR Maps (kafnun/qr-maps)
      const SCRIPT_DB_QR = "https://script.google.com/macros/s/AKfycbx2789HLnjZHffcDRQI7X3lCRHAYYg7owmllKKnSjL9adjD_-klAJdYQ5M8uqx5-McU/exec";
                            
      if (qrId) {
        // A. Kirim Log Scan Format JSON (Memperbaiki error JSON.parse di Apps Script)
        const logData = {
          waktu: new Date().toLocaleString('id-ID'),
          qr_id: qrId,
          kota: 'Indonesia',
          perangkat: navigator.userAgent,
          ip: '-'
        };

        fetch(SCRIPT_LOG_SCAN, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(logData)
        }).catch(err => console.error("Gagal log scan:", err));

        // B. Cek Status Kartu ke Apps Script DB QR
        fetch(`${SCRIPT_DB_QR}?card_id=${qrId}`)
          .then(res => res.json())
          .then(data => {
            console.log("Data diterima:", data);

            const cardStatus = data.card_status;
            const targetUrl = data.nama_toko;

            if (cardStatus === 'active' && targetUrl && String(targetUrl).trim().startsWith('http')) {
              // KARTU AKTIF -> DIALIKAN KE GOOGLE MAPS / YOUTUBE / ROTASI NEWS
              window.location.href = String(targetUrl).trim();
            } else {
              // KARTU BELUM AKTIF -> DIALIKAN KE FORM AKTIVASI
              window.location.href = `https://qr-maps.vercel.app/activate.html?id=${qrId}`;
            }
          })
          .catch(err => {
            console.error("Error/Fallback DB QR:", err);
            window.location.href = `https://qr-maps.vercel.app/activate.html?id=${qrId}`;
          });
      } else {
        document.body.innerHTML = "<h2>ID Kartu tidak terdeteksi.</h2>";
      }
    </script>
</body>
</html>
