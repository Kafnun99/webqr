<script>
  // 1. Ambil ID dari URL (?id=A000001)
  const urlParams = new URLSearchParams(window.location.search);
  const qrId = urlParams.get('id') || 'UNKNOWN';

  // 2. MASUKKAN WEB APP URL BARU DARI STEP 1 DI SINI:
  const SCRIPT_LOG_SCAN = "https://script.google.com/macros/s/AKfycbwk5_QHmeUcTHyZ-oq64i9xPE9xa_xj2YTwBn4ItRNKI3qVU1AhqBU6EJKyQBfM5jMSOw/exec"; 

  // 3. Kirim log scan jika ID valid
  if (qrId !== 'UNKNOWN') {
    const formData = new URLSearchParams();
    formData.append('waktu', new Date().toLocaleString('id-ID'));
    formData.append('qr_id', qrId);
    formData.append('kota', 'Indonesia');
    formData.append('perangkat', navigator.userAgent);
    formData.append('ip', '-');

    fetch(SCRIPT_LOG_SCAN, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded'
      },
      body: formData
    })
    .then(() => {
      console.log("Log scan berhasil dicatat!");
    })
    .catch(err => console.error("Gagal mengirim log scan:", err));
  }
</script>
