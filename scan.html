<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengarahkan...</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 3px solid #1e293b;
            border-top: 3px solid #38bdf8;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div>
        <div class="loader"></div>
        <p>Mengarahkan Anda ke tujuan...</p>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const qrId = urlParams.get('id');

      // 1. URL Apps Script Log Scan
      const SCRIPT_LOG_SCAN = "https://script.google.com/macros/s/AKfycbwbhh5YZZd7bl1vBRc7JP-iOPaCFzLztcJa9uG76p4FT3w0H4Xd_DB5gpYfUwyMehhXqw/exec"; 
                              
                             
      // 2. URL Apps Script DB QR Maps
      const SCRIPT_DB_QR = "https://script.google.com/macros/s/AKfycbzUiP1q49KBQwbyypS_63TEpHILiCIhwzsjyBBVvPLsJhPInmQp-qs45pgqbIaozPLU/exec";
                         
      if (qrId) {
        // A. Kirim Log Scan secara asynchronous di latar belakang
        const formData = new URLSearchParams();
        formData.append('waktu', new Date().toLocaleString('id-ID'));
        formData.append('qr_id', qrId);
        formData.append('kota', 'Indonesia');
        formData.append('perangkat', navigator.userAgent);
        formData.append('ip', '-');

        fetch(SCRIPT_LOG_SCAN, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData
        }).catch(err => console.error("Gagal log scan:", err));

        // B. Cek Status DB QR Maps
        fetch(`${SCRIPT_DB_QR}?action=getCard&card_id=${qrId}`)
          .then(res => res.json())
          .then(resData => {
            console.log("Respon DB QR:", resData);

            // Ekstrak data (menangani jika respon dibungkus dalam resData.data atau langsung di resData)
            const item = resData.data || resData.card || resData;

            // Cari URL tujuan dari berbagai kemungkinan nama atribut
            const targetUrl = item.gmaps_url || item.nama_toko || item.link || item.no_hp || item.url || resData.gmaps_url || resData.nama_toko;

            // Cari status aktif dari berbagai kemungkinan nama atribut
            const statusKartu = String(item.status || item.card_status || resData.status || resData.card_status || '').toLowerCase();
            const isAktif = statusKartu.includes('active') || statusKartu.includes('aktif') || statusKartu.includes('terdaftar');

            // Jika status terdeteksi aktif dan URL tujuan berupa HTTP/HTTPS
            if (isAktif && targetUrl && String(targetUrl).trim().startsWith('http')) {
              window.location.href = String(targetUrl).trim();
            } else {
              // Jika belum aktif, arahkan ke form aktivasi
              window.location.href = `https://qr-maps.vercel.app/activate.html?id=${qrId}`;
            }
          })
          .catch(err => {
            console.error("Error/Fallback DB QR:", err);
            window.location.href = `https://qr-maps.vercel.app/activate.html?id=${qrId}`;
          });
      } else {
        document.body.innerHTML = "<h2>ID Kartu tidak terdeteksi.</h2>";
      }
    </script>
</body>
</html>
