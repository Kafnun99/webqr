<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mengarahkan...</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #ffffff; margin: 0; }
    .loader { text-align: center; color: #555; }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #007bff; border-radius: 50%; width: 32px; height: 32px; animation: spin 0.6s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p style="font-size: 14px;">Memuat halaman...</p>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwL1g3RLGss0zdKhbzWRB7PS80UtLB0mAnlr0uhLll5Jy1eJNo8yyQZnId-SksTgKpC/exec';

    const urlParams = new URLSearchParams(window.location.search);
    const cardId = urlParams.get('id') || window.location.pathname.split('/').pop() || 'A000001';

    async function processScan() {
      try {
        const res = await fetch(`${GAS_URL}?card_id=${cardId}`);
        const data = await res.json();

        // JIKA AKTIF: Langsung buka URL Tujuan (Google Maps/Review)
        if (data.card_status === 'active' && data.nama_toko && String(data.nama_toko).startsWith('http')) {
          window.location.replace(data.nama_toko);
        } else {
          // JIKA KOSONG / UNACTIVE: Buka Halaman Aktivasi
          window.location.replace(`https://qr-maps.vercel.app/activate.html?id=${cardId}`);
        }
      } catch (err) {
        // Fallback jika terjadi error koneksi
        window.location.replace(`https://qr-maps.vercel.app/activate.html?id=${cardId}`);
      }
    }

    processScan();
  </script>
</body>
</html>
