<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mengarahkan...</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f8f9fa; margin: 0; }
    .loader { text-align: center; color: #333; }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin: 0 auto 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Mengarahkan ke halaman merchant...</p>
  </div>

  <script>
    // URL Web App GAS (DB QR Maps) Anda
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbyyLRZArYBBCO8XffPrgj-Uc_CxFsGS6O5IRG8UNTwkEBwl9vH2IBgW5W79cIBVbvJS/exec';

    const urlParams = new URLSearchParams(window.location.search);
    const cardId = urlParams.get('id') || window.location.pathname.split('/').pop() || 'A000001';

    async function processScan() {
      try {
        // Menggunakan controller dengan timeout 4 detik agar tidak pernah gantung
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);

        const res = await fetch(`${GAS_URL}?card_id=${cardId}`, { signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json();

        // JIKA AKTIF: Langsung redirect ke URL Google Maps / Review
        if (data.card_status === 'active' && data.nama_toko && data.nama_toko.startsWith('http')) {
          window.location.href = data.nama_toko;
        } else {
          // JIKA KOSONG / UNACTIVE: Lempar ke Halaman Aktivasi Terpisah
          window.location.href = `https://qr-maps.vercel.app/activate.html?id=${cardId}`;
        }
      } catch (err) {
        // Fallback jika lambat/timeout: Langsung lempar ke halaman aktivasi
        window.location.href = `https://qr-maps.vercel.app/activate.html?id=${cardId}`;
      }
    }

    processScan();
  </script>
</body>
</html>
